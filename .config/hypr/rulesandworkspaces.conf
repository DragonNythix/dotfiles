# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# problem: the inital window title is "Mozilla Firefox" and by the time its already too late for the detection
windowrule {
   name = bitwarden-window
   match:class = firefox
   match:title = .*Bitwarden.*
   float = true
}

                                                                                                                             
windowrule = match:title flameshot, float true                                                                               
windowrule = match:title flameshot, move 0 0                                                                                 
windowrule = match:title flameshot, suppress_event fullscreen                                                                
                                                                                                                             
                                                                                                                             
# Hyprland-run windowrule                                                                                                    
windowrule {                                                                                                                 
    name = move-hyprland-run                                                                                                 
                                                                                                                             
    match:class = hyprland-run                                                                                               
                                                                                                                             
    move = 20 monitor_h-120                                                                                                  
    float = yes                                                                                                              
}                                                                                                                            
                                                                                                                             
layerrule {                                                                                                                  
    name = vicinae-blur                                                                                                      
    blur = on                                                                                                                
    ignore_alpha = 0                                                                                                         
    match:namespace = vicinae                                                                                                
}                                                                                                                            
layerrule {                                                                                                                  
    name = vicinae-no-animation                                                                                              
    no_anim = on                                                                                                             
    match:namespace = vicinae                                                                                                
}                                                                                                                            
                                                                                                                             
# gaming workspace                                                                                                           
workspace = name:gayming, rounding:false, gapsout:0, border:false, shadow:false, decorate:false                              
                                                                                                                             
workspace = special:termnial, on-created-empty: $terminal                                                                    
workspace = special:filemanager, on-created-empty: $fileManager                                                              
workspace = special:editor, on-created-empty: $textEditor                                                                    
workspace = special:monitor, on-created-empty: $systemMonitor
workspace = name:gayming, on-created-empty: exec, pypr menu "games"
